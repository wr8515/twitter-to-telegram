services:
  twitter-to-telegram:
    build: .
    init: true
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 896m
    pids_limit: 160
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      X_COOKIE_FILE: /run/secrets/x_cookies
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    secrets:
      - telegram_bot_token
      - x_cookies
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  x_cookies:
    file: ./secrets/x-cookies.json
